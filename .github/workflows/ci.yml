name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # windows-latest is Windows Server 2025 with Visual Studio 2026; the .NET 10 SDK needs MSBuild 18 or later.
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,)'

      - name: Restore
        run: msbuild PillionProgrammer.sln /t:Restore /p:Configuration=Release /nologo

      - name: Build (full solution, including the VSIX)
        run: msbuild PillionProgrammer.sln /p:Configuration=Release /m /nologo /clp:Summary

      - name: Test
        run: dotnet test PillionProgrammer.NoVsix.slnf --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: Pillion.VisualStudio.vsix
          path: src/Pillion.VisualStudio/bin/Release/net48/Pillion.VisualStudio.vsix
          if-no-files-found: error
